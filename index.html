<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellness Habit Tracker</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    button {
      border-radius: 5px;
      background-color: white;
      border: none;

    }

    footer {
      background-color: black;
      color: white;
      text-align: center;
      position: fixed;
      width: 100%;
      bottom: 0;
      height: auto;
    }

    nav {
      background-color: black;
      color: white;
      height: 20%;
      padding: 20px;
      display: flex;
      justify-content: space-between;
    }

    #navlinks {
      display: inline-block;
    }

    a {
      color: white;
      text-decoration: none;
      margin: 10px;
    }

    a:hover {
      text-decoration: underline;
      transition: 0.3s;

    }

    #container {

      display: grid;
      grid-template-columns: auto auto auto;
    }

    .container {
      border: 1px solid lightblue;
      height: 80vh;
      padding: 10px;
    }
    li *{
      margin-left: 10px;
    }

    button {
      border: 1px solid black;
      cursor: pointer;
      background-color: lightblue;
    }
    button:hover {
      background-color: deepskyblue;
      transition: 0.3s;
    }

    @media (max-width: 425px) {
      #container {
        grid-template-columns: auto;
      }

    }

    @media (max-width: 768px) {
      #container {
        grid-template-columns: auto auto;
      }

    }
  </style>
</head>

<body>
  <nav>
    Habit Tracker
    <div id="navlinks">
      <a href="home.html">Home</a>
      <a href="Dashboard.html">Dashboard</a>
      <a href="About.html">About</a>
    </div>
    <button id="toggle">Change Theme</button>
  </nav>
  <div id="container">
    <div id="habitinputandlist" class="container">
      <div id="habitinput">
        <form action="" id="habitform">
          <input type="text" id="newhabit" placeholder="Enter a new habit" required />
          <input type="submit" value="Add this Habit">
        </form>
      </div>
      <div id="habitlist">
        <h4>Your habits:</h4>
        <select name="" id="filter">
          <option value="all" id="all">All</option>
          <option value="completed" id="completed">Completed</option>
          <option value="pending" id="pending">Pending</option>
        </select>
        <ul id="habits">

        </ul>

      </div>
    </div>
    <div id="streaksandstats" class="container"></div>
    <div id="qoutes" class="container"></div>
  </div>
  <footer>
    <p>&copy; 2024 Wellness Habit Tracker. All rights reserved.</p>
  </footer>

  <script>
    console.log(document.getElementById('habits').children.length==0);
    if(document.getElementById('habits').children.length==0){
      document.getElementById('habits').innerHTML='<p id="nohabitsmsg"><i>No habits added yet. Start by adding a new habit!</i></p>';
    }
    document.getElementById('habitform').addEventListener('submit', newhabit);
    //document.getElementById('completebtn'.addEventListener('click', completehabit));
    //document.getElementById('delbtn').addEventListener('click', deletehabit);
    function newhabit() {
      event.preventDefault();
      
      if(document.getElementById('nohabitsmsg').style.display!='none')
      document.getElementById('nohabitsmsg').style.display='none'; //clear "no habits" message when adding first habit
      
      const habitInput = document.getElementById('newhabit');
      const habitList = document.getElementById('habits');
      

      const completebtn=document.createElement('button');
      completebtn.textContent='Completed';
      completebtn.classList.add('completebtn',habitInput.value);

      const delbtn=document.createElement('button');
      delbtn.textContent='Delete';
      delbtn.classList.add('delbtn',habitInput.value);

      const habititem = document.createElement('li');
      habititem.textContent = habitInput.value;
      habititem.id = 'pending';

      habititem.appendChild(completebtn);
      habititem.appendChild(delbtn);
      console.log(habititem);

      habitList.appendChild(habititem);
      
      habitInput.value = '';
    }

    document.getElementById('habits').addEventListener('click', changehabit);
    function changehabit(e) {
      if(e.target.classList.contains('completebtn')){
        const habit=e.target.parentElement;
        habit.id='completed';
        habit.style.textDecoration='line-through';
      }
      else if(e.target.classList.contains('delbtn')){
        const habit=e.target.parentElement;
        habit.remove();
        
      }
    }
  </script>
</body>

</html>
